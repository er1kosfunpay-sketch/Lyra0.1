[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra"
version = "0.1.0"
description = "Lyra 0.1 conversation-first language model and training pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "tokenizers>=0.19",
  "numpy>=1.26",
]

[project.optional-dependencies]
data = [
  "huggingface-hub>=0.25",
]
serve = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "uvicorn>=0.27",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["lyra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
