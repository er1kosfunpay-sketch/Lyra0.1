[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-lm"
version = "0.1.0"
description = "From-scratch decoder-only language model and training pipeline"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "tokenizers>=0.19", "numpy>=1.26", "safetensors>=0.4", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
data = ["datasets>=3.0", "huggingface_hub>=0.25", "pyarrow>=17"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["lyra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
